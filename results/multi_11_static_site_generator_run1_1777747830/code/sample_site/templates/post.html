<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - My Static Site</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    {{navigation}}
    <main>
        <article>
            <h1>{{title}}</h1>
            <small class="post-date">Published: {{date}}</small>
            {{content}}
        </article>
    </main>
    <footer>
        <p>&copy; 2025 My Static Site. Built with Python.</p>
    </footer>
</body>
</html>
