<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        {{navigation}}
    </header>
    <main>
        <article class="post">
            <h1>{{title}}</h1>
            {{date}}
            <div class="post-content">
                {{content}}
            </div>
        </article>
    </main>
    <footer>
        <p>&copy; 2025 My Static Site. Built with SSG.</p>
    </footer>
</body>
</html>
