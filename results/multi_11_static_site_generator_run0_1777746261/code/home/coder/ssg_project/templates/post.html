<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1><a href="/">My Static Site</a></h1>
        <nav>
            {{navigation}}
        </nav>
    </header>

    <main>
        <article class="post">
            <header class="post-header">
                <h1>{{title}}</h1>
                <div class="post-meta">
                    {{date}}
                    {{tags}}
                </div>
            </header>
            <div class="post-content">
                {{content}}
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2025 My Static Site. Built with SSG.</p>
    </footer>
</body>
</html>
