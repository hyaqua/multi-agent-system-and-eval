<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title"><a href="/">Static Site Generator</a></h1>
            {{nav}}
        </div>
    </header>

    <main class="container">
        <article class="post">
            <header class="post-header">
                <h1 class="post-title">{{title}}</h1>
                <div class="post-meta">
                    <time datetime="{{date}}">{{formatted_date}}</time>
                    {{tags_html}}
                </div>
            </header>
            <div class="post-content">
                {{content}}
            </div>
        </article>
        <p class="back-link"><a href="/posts/">&larr; Back to all posts</a></p>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Static Site Generator. Built with Python.</p>
        </div>
    </footer>
</body>
</html>
